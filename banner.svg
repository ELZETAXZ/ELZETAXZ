<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alan - Systems Engineering student" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050a"/>
      <stop offset="1" stop-color="#0a1736"/>
    </linearGradient>
    <linearGradient id="led" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1e5bff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5aa9ff"/>
      <stop offset="1" stop-color="#1e5bff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1b2a52" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <clipPath id="ledclip">
      <rect x="60" y="176" width="780" height="4"/>
    </clipPath>
  </defs>

  <style>
    .title { font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace; font-weight: 700; font-size: 68px; letter-spacing: 14px; fill: #eaf2ff; }
    .sub { font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace; font-size: 17px; letter-spacing: 3px; fill: #6f94dc; }
    .tag { font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace; font-size: 12px; letter-spacing: 2px; fill: #2c4a8f; }
    .cursor { fill: #4da3ff; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    .d2 { animation-delay: .5s; }
    .d3 { animation-delay: 1s; }
    @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  </style>

  <rect width="900" height="260" rx="14" fill="url(#bg)"/>
  <rect width="900" height="260" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="14" fill="none" stroke="#12234d"/>

  <!-- LEDs de esquina -->
  <g filter="url(#softglow)">
    <circle class="dot" cx="64" cy="48" r="4" fill="#2f7bff"/>
    <circle class="dot d2" cx="82" cy="48" r="4" fill="#4da3ff"/>
    <circle class="dot d3" cx="100" cy="48" r="4" fill="#1e5bff"/>
  </g>
  <text class="tag" x="840" y="52" text-anchor="end">STATUS: ONLINE</text>

  <!-- Texto -->
  <text class="title" x="60" y="128" filter="url(#softglow)">ALAN</text>
  <text class="sub" x="62" y="158">SYSTEMS ENGINEERING  /  C#  /  .NET<tspan class="cursor"> _</tspan></text>

  <!-- Linea LED -->
  <rect x="60" y="177" width="780" height="2" fill="#0f1f45"/>
  <g clip-path="url(#ledclip)" filter="url(#glow)">
    <rect x="-220" y="176" width="220" height="4" fill="url(#led)">
      <animate attributeName="x" from="-220" to="840" dur="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text class="tag" x="60" y="214">&gt; build. break. learn. repeat.</text>
</svg>
