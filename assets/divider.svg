<svg width="900" height="12" viewBox="0 0 900 12" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="led" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1e5bff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5aa9ff"/>
      <stop offset="1" stop-color="#1e5bff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="c"><rect x="0" y="5" width="900" height="2"/></clipPath>
  </defs>
  <rect x="0" y="5" width="900" height="2" fill="#0f1f45"/>
  <g clip-path="url(#c)" filter="url(#glow)">
    <rect x="-200" y="4" width="200" height="4" fill="url(#led)">
      <animate attributeName="x" from="-200" to="900" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
